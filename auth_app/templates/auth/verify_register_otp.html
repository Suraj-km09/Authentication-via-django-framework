
{% extends "layouts/app.html" %}
{% block title %}Verify OTP — AuthApp{% endblock %}

{% block content %}
<div class="card" style="max-width:520px;">
  <h2>Verify Registration OTP</h2>
  <p class="muted">Enter the OTP sent to your email to activate your account.</p>

  {% if error %}<div class="msg msg-error">{{ error }}</div>{% endif %}

  <form method="post">
    {% csrf_token %}
    <label>OTP</label>
    <input type="text" name="code" maxlength="6" required />
    <button type="submit">Verify & Activate</button>
  </form>

  <form method="post" action="{% url 'auth_app:resend_register_otp' %}" style="margin-top:12px;">
    {% csrf_token %}
    <button type="submit">Resend OTP</button>
  </form>
</div>
{% endblock %}
